<script>
(function () {
  var out = document.getElementById('post-content');
  var id = new URLSearchParams(location.search).get('post') || '';
  if (!/^\d{8}$/.test(id)) { out.textContent = 'Post not found.'; return; }
  Posts.load(id).then(function (p) {
    var title = p.meta.title || id;
    document.title = title + ' \u2014 Eric Chellis';
    out.innerHTML = '';
    if (p.meta.date) {
      var d = document.createElement('span');
      d.className = 'post-meta';
      d.textContent = p.meta.date;
      out.appendChild(d);
    }
    var h1 = document.createElement('h1');
    h1.textContent = title;
    out.appendChild(h1);
    out.appendChild(Posts.imageEl(p, 'post-image'));
    var body = document.createElement('div');
    body.innerHTML = marked.parse(p.body);
    // Relative image paths in the post resolve against the post's own folder.
    Array.prototype.forEach.call(body.querySelectorAll('img'), function (img) {
      var src = img.getAttribute('src') || '';
      if (!/^([a-z]+:|\/\/|\/|#|data:)/i.test(src)) img.setAttribute('src', 'content/' + id + '/' + src);
    });
    out.appendChild(body);
  }).catch(function () { out.textContent = 'Post not found.'; });
})();
</script>
