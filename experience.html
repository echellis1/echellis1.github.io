<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(function () {
  var DIR = 'experience/';
  var GITHUB_API = 'https://api.github.com/repos/echellis1/ericchellis.github.io/contents/experience';
  var MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var out = document.getElementById('experience-content');

  function text(r) { if (!r.ok) throw new Error(r.status); return r.text(); }

  // Local servers expose a directory listing; GitHub Pages does not, so fall back to the GitHub API.
  function listFiles() {
    return fetch(DIR, { cache: 'no-cache' }).then(text).then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var names = Array.prototype.map.call(doc.querySelectorAll('a'), function (a) {
        return decodeURIComponent(a.getAttribute('href') || '').split('/').pop();
      }).filter(function (n) { return /\.md$/i.test(n); });
      if (!names.length) throw new Error('empty listing');
      return names;
    }).catch(function () {
      return fetch(GITHUB_API).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (items) {
          return items.filter(function (i) { return /\.md$/i.test(i.name); })
                      .map(function (i) { return i.name; });
        });
    });
  }

  function monthIndex(str) {
    if (/present/i.test(str)) return Infinity;
    var m = str.match(/([A-Za-z]+)\s+(\d{4})/);
    return m ? parseInt(m[2], 10) * 12 + Math.max(0, MONTHS.indexOf(m[1].slice(0, 3).toLowerCase())) : 0;
  }

  // Sort by end date then start date, newest first, using the "*Month YYYY – Month YYYY*" line.
  function sortKey(md) {
    var m = md.match(/\*([^*]+?)\s+[–-]\s+([^*]+?)\*/);
    return m ? { end: monthIndex(m[2]), start: monthIndex(m[1]) } : { end: 0, start: 0 };
  }

  listFiles().then(function (names) {
    return Promise.all(names.map(function (n) {
      return fetch(DIR + encodeURIComponent(n), { cache: 'no-cache' }).then(text);
    }));
  }).then(function (docs) {
    docs.sort(function (a, b) {
      var x = sortKey(a), y = sortKey(b);
      return (y.end === x.end ? 0 : y.end > x.end ? 1 : -1) || (y.start - x.start);
    });
    out.innerHTML = docs.map(function (md) { return marked.parse(md); }).join('\n<hr />\n');
  }).catch(function () {
    out.textContent = 'Unable to load experience.';
  });
})();
</script>
